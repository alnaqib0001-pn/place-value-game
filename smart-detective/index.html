
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المحقق الذكي | ما البيانات المفقودة؟</title>
<style>
:root{
  --navy:#163456;
  --blue:#2563eb;
  --sky:#eaf4ff;
  --gold:#fbbf24;
  --green:#15803d;
  --light:#f6f9fd;
  --red:#dc2626;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--light);
  color:var(--navy);
  font-family:Tahoma,Arial,sans-serif;
  font-size:19px;
  line-height:1.8;
}
header{
  background:linear-gradient(125deg,#12355c,#2563eb);
  color:white;
  padding:25px 18px;
  text-align:center;
}
header h1{margin:0;font-size:clamp(27px,5vw,43px)}
header p{margin:5px 0}
main{max-width:1120px;margin:25px auto;padding:0 15px}
.panel{
  background:white;
  border:2px solid #dbe7f5;
  border-radius:23px;
  padding:24px;
  margin-bottom:18px;
  box-shadow:0 5px 18px #17345609;
}
h2{font-size:clamp(24px,4vw,32px);margin:0 0 15px}
h3{margin:8px 0;color:#24517c}
small,.muted{color:#61758d}
.topline{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:12px;
  margin-bottom:15px;
}
.tag{
  background:#e7f2ff;
  color:#174f80;
  border-radius:25px;
  padding:5px 16px;
  font-weight:bold;
}
.progress{
  background:#dce7f4;
  height:14px;
  border-radius:20px;
  overflow:hidden;
  margin-bottom:22px;
}
#progressFill{
  background:linear-gradient(90deg,#38bdf8,#16a34a);
  height:100%;
  width:0;
  transition:width .4s;
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
}
@media(max-width:750px){
  .grid{grid-template-columns:1fr}
  .panel{padding:15px}
  body{font-size:17px}
}
.scroll{overflow-x:auto}
table{
  width:100%;
  border-collapse:collapse;
  text-align:center;
  min-width:480px;
  font-size:17px;
}
th,td{
  border:1px solid #cddbed;
  padding:9px 6px;
}
th{background:#e4f0ff}
tr:nth-child(even) td{background:#f7fbff}
button,input{font:inherit}
button{
  padding:12px 20px;
  background:#fff;
  border:2px solid #cbdced;
  border-radius:15px;
  cursor:pointer;
  color:var(--navy);
  font-weight:bold;
  transition:.16s;
  touch-action:manipulation;
}
button:hover{border-color:var(--blue);background:#edf6ff}
button:focus-visible{
  outline:4px solid #fbbf24;
  outline-offset:2px;
}
button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:var(--blue);color:white;border-color:var(--blue)}
.primary:hover{background:#174ec1;color:white}
.success{background:var(--green);color:white;border-color:var(--green)}
.success:hover{background:#166534;color:white}
.choicebox{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:600px){.choicebox{grid-template-columns:repeat(2,1fr)}}
.selected{background:#dcefff;border-color:#2563eb}
.correct{background:#dcfce7;border-color:#16a34a}
.feedback{
  margin-top:17px;
  padding:13px 17px;
  border-radius:15px;
  font-weight:bold;
  display:none;
}
.feedback.good{display:block;background:#dcfce7;color:#166534}
.feedback.bad{display:block;background:#fee2e2;color:#991b1b}
.feedback.info{display:block;background:#fff3d1;color:#854d0e}
.actions{
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:12px;
  margin-top:20px;
}
.hidden{display:none!important}
.chart{
  background:#f8fbff;
  border:1px solid #dbe7f5;
  border-radius:18px;
  padding:16px 10px;
}
.bars{
  height:280px;
  display:flex;
  align-items:flex-end;
  justify-content:space-around;
  gap:10px;
  border-bottom:3px solid #59718c;
  padding:10px 5px 0;
}
.barcol{
  flex:1;
  max-width:100px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
  height:100%;
  gap:5px;
}
.bar{
  width:62%;
  min-height:1px;
  border-radius:6px 6px 0 0;
  border:1px solid #64748b;
  transition:height .3s;
}
.barlabel{
  color:#163456;
  font-weight:bold;
}
.colors{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:8px;
}
@media(max-width:650px){.colors{grid-template-columns:repeat(2,1fr)}}
.colorcontrol{
  border:1px solid #cbdced;
  padding:10px 5px;
  border-radius:14px;
  text-align:center;
  background:#f8fbff;
}
.colorcontrol input{
  width:68px;
  max-width:100%;
  text-align:center;
  font-size:24px;
  border:2px solid #b6cde7;
  border-radius:10px;
}
.dot{
  width:16px;height:16px;
  display:inline-block;border:1px solid #999;
  border-radius:50%;vertical-align:middle;
}
.plotwrap{overflow-x:auto;background:#f8fbff;border-radius:18px;padding:10px}
.plotwrap svg{width:100%;max-width:680px;min-width:330px;display:block;margin:auto}
.note{
  background:#fff7dc;border-right:5px solid #f59e0b;
  padding:15px;border-radius:12px;margin:15px 0;
}
.reward{
  text-align:center;
  background:linear-gradient(145deg,#fff9e7,#e9f8ff);
  border:4px solid #eab308;
  padding:35px 15px;
  border-radius:25px;
}
.medal{font-size:90px;line-height:1.4}
#studentName{
  padding:12px;border:2px solid #abc8e3;
  border-radius:12px;max-width:100%;width:330px;
}
footer{text-align:center;color:#6b7d90;padding:20px}
@media print{
  body{background:white}
  header,.progress,.topline,.actions,footer,#nameForm{display:none!important}
  main{margin:0}
  .panel{border:0;box-shadow:none}
  .reward{min-height:75vh;display:flex;flex-direction:column;justify-content:center}
}
</style>
</head>

<body>
<header>
  <h1>🕵️ المحقق الذكي</h1>
  <p>النشاط الثالث: ما البيانات المفقودة؟</p>
  <p>رياضيات الصف الرابع الابتدائي</p>
</header>

<main>
  <div class="topline">
    <span id="stageName" class="tag">القضية الأولى</span>
    <span id="stageCounter">الخطوة ١ من ٧</span>
  </div>
  <div class="progress"><div id="progressFill"></div></div>
  <div id="game" aria-live="polite"></div>
</main>

<footer>لعبة تعليمية تفاعلية مستوحاة من النشاط الثالث في كتاب الرياضيات</footer>

<script>
"use strict";

/* الأرقام العربية المشرقية في الواجهة */
const nf=new Intl.NumberFormat("ar-EG",{useGrouping:false});
const ar=n=>nf.format(n);
const digitMap="٠١٢٣٤٥٦٧٨٩";
const toNumber=s=>Number(String(s).replace(/[٠-٩]/g,
  c=>String(digitMap.indexOf(c))));

/* بيانات المهمة الأولى من كتاب الطالب */
const colors=[
  {name:"أحمر",hex:"#ef4444"},
  {name:"أزرق",hex:"#38bdf8"},
  {name:"أخضر",hex:"#4ade80"},
  {name:"أصفر",hex:"#facc15"},
  {name:"أبيض",hex:"#ffffff"}
];
const shirts=[
  {name:"فريد",values:[1,0,1,0,2]},
  {name:"كريم",values:[1,1,1,1,2]},
  {name:"جابر",values:[0,4,0,0,3]},
  {name:"هشام",values:[1,0,0,1,5]},
  {name:"سالم",values:[2,1,1,1,1]},
  {name:"سلمان",values:[1,0,2,2,2]}
];
const shirtsMissing=[5,6,4,5,13];
const shirtsFull=[6,6,5,5,15];

/* بيانات المهمة الثانية من كتاب الطالب */
const rooms=[
  {id:1,desks:24,windows:5},
  {id:2,desks:24,windows:7},
  {id:3,desks:26,windows:4},
  {id:4,desks:28,windows:10},
  {id:5,desks:27,windows:7},
  {id:6,desks:26,windows:6},
  {id:7,desks:24,windows:4},
  {id:8,desks:27,windows:8},
  {id:9,desks:26,windows:5},
  {id:10,desks:27,windows:6}
];

/* حالة اللعبة */
let step=0;
let solved=false;
let pickedRooms=[];
let addedPoints=[];
let selectedRoom=null;
let totalCorrect=0;
let soundEnabled=true;
let audioContext=null;

const game=document.getElementById("game");
const $=id=>document.getElementById(id);

function beep(ok=true){
  if(!soundEnabled)return;
  try{
    audioContext=audioContext||
      new(window.AudioContext||window.webkitAudioContext)();
    let t=audioContext.currentTime;
    const o=audioContext.createOscillator();
    const g=audioContext.createGain();
    o.type="sine";
    o.frequency.setValueAtTime(ok?650:220,t);
    if(ok)o.frequency.setValueAtTime(850,t+.12);
    g.gain.setValueAtTime(.045,t);
    g.gain.exponentialRampToValueAtTime(.001,t+.2);
    o.connect(g).connect(audioContext.destination);
    o.start(t);o.stop(t+.22);
  }catch(e){}
}
function feedback(text,type="good"){
  const f=$("feedback");
  if(!f)return;
  f.className="feedback "+type;
  f.textContent=text;
  if(type==="good")beep(true);
  if(type==="bad")beep(false);
}
function nextReady(){
  solved=true;
  const b=$("nextButton");
  if(b){b.disabled=false;b.classList.remove("hidden")}
}
function markSolved(){
  if(!solved)totalCorrect++;
  nextReady();
}
function next(){
  if(!solved)return;
  step=Math.min(6,step+1);
  solved=false;
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}
function previous(){
  if(step===0)return;
  step--;
  solved=false;
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}
function actionArea(label="الانتقال إلى الخطوة التالية ←"){
  return `
    <div id="feedback" class="feedback" role="status"></div>
    <div class="actions">
      <button onclick="previous()" ${step===0?"disabled":""}>
        ↩ الخطوة السابقة
      </button>
      <button id="nextButton" class="success hidden"
        onclick="next()" disabled>${label}</button>
    </div>`;
}
function titles(){
 const names=[
 "القضية الأولى • اكتشف الطالب المفقود",
 "القضية الأولى • أكمل التمثيل",
 "القضية الأولى • حلّل النتائج",
 "القضية الثانية • اكتشف الغرفتين",
 "القضية الثانية • أكمل النقاط",
 "القضية الثانية • استنتج الفرق",
 "وسام المحقق الذكي"
 ];
 $("stageName").textContent=names[step];
 $("stageCounter").textContent="الخطوة "+ar(step+1)+" من "+ar(7);
 $("progressFill").style.width=((step+1)/7*100)+"%";
}
function tableShirts(){
 return `<div class="scroll"><table>
 <thead><tr><th>الطالب</th>
 ${colors.map(c=>`<th>${c.name}</th>`).join("")}</tr></thead>
 <tbody>${shirts.map(s=>`<tr>
 <th>${s.name}</th>
 ${s.values.map(v=>`<td>${v===0?"صفر":ar(v)}</td>`).join("")}
 </tr>`).join("")}</tbody></table></div>`;
}
function barChart(nums,title){
 const max=16;
 return `<div class="chart">
 <h3 style="text-align:center">${title}</h3>
 <p style="text-align:center" class="muted">عدد القمصان حسب اللون</p>
 <div class="bars">
 ${nums.map((n,i)=>`
  <div class="barcol">
   <strong>${ar(n)}</strong>
   <div class="bar" style="height:${n/max*215}px;
    background:${colors[i].hex}"></div>
  </div>`).join("")}
 </div>
 <div style="display:flex;justify-content:space-around;
  gap:5px;text-align:center;font-size:16px">
 ${colors.map(c=>`<span>${c.name}</span>`).join("")}
 </div></div>`;
}
function render(){
 titles();
 if(step===0)scene1();
 if(step===1)scene2();
 if(step===2)scene3();
 if(step===3)scene4();
 if(step===4)scene5();
 if(step===5)scene6();
 if(step===6)scene7();
}

/* الخطوة الأولى: اكتشاف فريد */
function scene1(){
 game.innerHTML=`
 <section class="panel">
 <h2>🧩 القضية الأولى: القمصان المفقودة</h2>
 <p>أجرى سالم مسحًا لألوان القمصان التي يمتلكها
 ستة طلاب. لكنه نسي إدراج بيانات طالب واحد
 في التمثيل البياني!</p>
 <div class="grid">
 <div><h3>📋 سجل الأدلة</h3>${tableShirts()}</div>
 <div>${barChart(shirtsMissing,"تمثيل سالم الناقص")}</div>
 </div>
 <div class="note">
 🔍 دليل المحقق: يقول سالم إن الأبيض أكثر الألوان
 شيوعًا، وإن الأزرق أكثر شيوعًا من الأحمر،
 والأصفر أكثر شيوعًا من الأخضر.
 </div>
 <h3>السؤال (أ): من الطالب الذي لم تُدرج بياناته؟</h3>
 <div class="choicebox">
 ${shirts.map(s=>`<button onclick="answerStudent('${s.name}',this)">
 ${s.name}</button>`).join("")}
 </div>
 ${actionArea("الخطوة ٢: أكمل التمثيل ←")}
 </section>`;
}
function answerStudent(name,btn){
 if(solved)return;
 if(name==="فريد"){
   btn.classList.add("correct");
   markSolved();
   feedback("أحسنت أيها المحقق البطل! فريد هو الطالب المفقود. بإضافة بياناته يصبح الأحمر مساويًا للأزرق، والأخضر مساويًا للأصفر.");
 }else{
   feedback("حاول مجددًا! قارن مجموع كل لون في الجدول بالأعمدة الموجودة في الرسم.","bad");
 }
}

/* الخطوة الثانية: إكمال الأعمدة */
function scene2(){
 game.innerHTML=`
 <section class="panel">
 <h2>📊 (ب) أكمل التمثيل البياني</h2>
 <p>اعتمد على جدول الطلاب الستة، واحسب مجموع
 القمصان من كل لون، ثم اكتب عددها.</p>
 <div class="grid">
 <div>${tableShirts()}</div>
 <div>
 <div class="colors">
 ${colors.map((c,i)=>`
  <div class="colorcontrol">
  <span class="dot" style="background:${c.hex}"></span>
  <br><strong>${c.name}</strong><br>
  <input id="color${i}" value="${ar(shirtsMissing[i])}"
    inputmode="numeric" aria-label="عدد القمصان ${c.name}">
  </div>`).join("")}
 </div>
 <div id="liveBars">${barChart(shirtsMissing,"التمثيل الذي تكمله")}</div>
 </div></div>
 <div class="actions">
 <button class="primary" onclick="checkShirts()">🔎 تحقق من التمثيل</button>
 </div>
 ${actionArea("الخطوة ٣: قارن النتائج ←")}
 </section>`;
 for(let i=0;i<5;i++){
   $("color"+i).addEventListener("input",updateBars);
 }
}
function readBars(){
 return colors.map((c,i)=>toNumber($("color"+i).value));
}
function updateBars(){
 const vals=readBars().map(n=>Number.isFinite(n)&&n>=0?Math.min(n,16):0);
 $("liveBars").innerHTML=barChart(vals,"التمثيل الذي تكمله");
}
function checkShirts(){
 const vals=readBars();
 if(vals.every((n,i)=>n===shirtsFull[i])){
   markSolved();
   feedback("رائع! التمثيل مكتمل. الأحمر ٦، الأزرق ٦، الأخضر ٥، الأصفر ٥، والأبيض ١٥.");
 }else{
   feedback("هناك عدد يحتاج إلى مراجعة. أضف قمصان فريد إلى الأعمدة الأصلية، ولا تنس أن كلمة «صفر» تعني عدم وجود قمصان.","bad");
 }
}

/* الخطوة الثالثة: مقارنة النتائج */
function scene3(){
 game.innerHTML=`
 <section class="panel">
 <h2>🧠 (ج) ماذا تغير في استنتاج سالم؟</h2>
 <div class="grid">
 ${barChart(shirtsMissing,"التمثيل الناقص")}
 ${barChart(shirtsFull,"التمثيل المكتمل")}
 </div>
 <h3>أي العبارات التالية صحيحة بعد إضافة بيانات فريد؟</h3>
 <div class="choicebox">
 <button onclick="answerCompare(0,this)">
 لا تزال الزرقاء أكثر من الحمراء
 </button>
 <button onclick="answerCompare(1,this)">
 الحمراء تساوي الزرقاء، والخضراء تساوي الصفراء
 </button>
 <button onclick="answerCompare(2,this)">
 الأحمر هو اللون الأكثر شيوعًا
 </button></div>
 ${actionArea("ابدأ القضية الثانية ←")}
 </section>`;
}
function answerCompare(n,btn){
 if(solved)return;
 if(n===1){
  btn.classList.add("correct");
  markSolved();
  feedback("تحقيق ناجح! الأبيض ما زال الأكثر شيوعًا، لكن الأحمر أصبح مساويًا للأزرق، والأخضر أصبح مساويًا للأصفر.");
 }else feedback("قارن ارتفاع الأعمدة بعد الإضافة، ثم حاول مرة أخرى.","bad");
}

/* بيانات الغرف */
function roomTable(all=true){
 const rows=all?rooms:rooms.filter(r=>r.id===3||r.id===5);
 return `<div class="scroll"><table>
 <thead><tr><th>الغرفة</th><th>عدد المكاتب</th>
 <th>عدد النوافذ</th></tr></thead><tbody>
 ${rows.map(r=>`<tr><td>${ar(r.id)}</td>
 <td>${ar(r.desks)}</td><td>${ar(r.windows)}</td></tr>`).join("")}
 </tbody></table></div>`;
}
function plot(showMissing=false){
 const w=610,h=355,left=65,bottom=300,top=35;
 const xs=n=>left+(n-23)*95;
 const ys=n=>bottom-(n-3)*34;
 let grid="";
 for(let y=4;y<=10;y++){
   grid+=`<line x1="${left}" y1="${ys(y)}" x2="555"
     y2="${ys(y)}" stroke="#dde6f1"/>
     <text x="43" y="${ys(y)+6}" font-size="16"
     text-anchor="middle">${ar(y)}</text>`;
 }
 for(let x=24;x<=28;x++){
  grid+=`<line x1="${xs(x)}" y1="${top}"
     x2="${xs(x)}" y2="${bottom}" stroke="#e4ecf7"/>
     <text x="${xs(x)}" y="326" text-anchor="middle"
     font-size="17">${ar(x)}</text>`;
 }
 let points="";
 for(const r of rooms){
  const missing=r.id===3||r.id===5;
  if(missing&&!showMissing&&!addedPoints.includes(r.id))continue;
  const added=missing;
  points+=`<circle cx="${xs(r.desks)}" cy="${ys(r.windows)}"
    r="9" fill="${added?"#22c55e":"#fbbf24"}"
    stroke="${added?"#15803d":"#b77912"}"
    stroke-width="2">
    <title>الغرفة ${ar(r.id)}: ${ar(r.desks)} مكتبًا،
    ${ar(r.windows)} نوافذ</title></circle>`;
 }
 return `<div class="plotwrap">
 <svg viewBox="0 0 ${w} ${h}" role="img"
 aria-label="تمثيل بالنقاط لعدد المكاتب والنوافذ">
 ${grid}
 <line x1="${left}" y1="${bottom}" x2="565"
 y2="${bottom}" stroke="#334155" stroke-width="3"/>
 <line x1="${left}" y1="${bottom}" x2="${left}"
 y2="25" stroke="#334155" stroke-width="3"/>
 ${points}
 <text x="300" y="351" text-anchor="middle"
 font-size="17">عدد المكاتب</text>
 <text x="17" y="185" font-size="17" text-anchor="middle"
 transform="rotate(-90 17 185)">عدد النوافذ</text>
 </svg></div>`;
}

/* الخطوة الرابعة: اكتشاف الغرفتين */
function scene4(){
 pickedRooms=[];
 addedPoints=[];
 game.innerHTML=`
 <section class="panel">
 <h2>🏫 القضية الثانية: النوافذ والمكاتب</h2>
 <p>جمع محسن بيانات عن عدد المكاتب والنوافذ
 في عشر غرف صفية، ثم نسي إدراج بيانات غرفتين.</p>
 <div class="grid">
 <div><h3>📋 جدول محسن</h3>${roomTable()}</div>
 <div><h3>📍 تمثيل محسن الناقص</h3>${plot()}</div>
 </div>
 <h3>السؤال (أ): أي غرفتين لم تُدرج بياناتهما؟</h3>
 <p class="muted">اختر غرفتين من الأزرار التالية.</p>
 <div class="choicebox">
 ${rooms.map(r=>`<button id="room${r.id}"
 onclick="pickRoom(${r.id})">الغرفة ${ar(r.id)}</button>`).join("")}
 </div>
 <div class="actions">
 <button class="primary" onclick="checkRooms()">تحقق من الغرفتين</button>
 </div>
 ${actionArea("الخطوة التالية: أضف النقطتين ←")}
 </section>`;
}
function pickRoom(id){
 if(solved)return;
 const index=pickedRooms.indexOf(id);
 if(index>=0)pickedRooms.splice(index,1);
 else if(pickedRooms.length<2)pickedRooms.push(id);
 rooms.forEach(r=>{
  $("room"+r.id).classList.toggle("selected",
   pickedRooms.includes(r.id));
 });
}
function checkRooms(){
 if(pickedRooms.length!==2){
  feedback("اختر غرفتين أولًا يا محقق.","info");
  return;
 }
 if(pickedRooms.includes(3)&&pickedRooms.includes(5)){
  markSolved();
  feedback("أحسنت! الغرفتان المفقودتان هما ٣ و٥. الآن أكمل بياناتهما في الرسم.");
 }else feedback("راجع الأزواج المرتبة في الجدول وقارنها بالنقاط الظاهرة.","bad");
}

/* الخطوة الخامسة: إكمال نقطتي الغرفتين */
function scene5(){
 addedPoints=[];
 selectedRoom=null;
 game.innerHTML=`
 <section class="panel">
 <h2>✏️ (ب) أكمل تمثيل محسن</h2>
 <p>اختر الغرفة ثم حدّد الزوج المرتب الصحيح.
 العدد الأول يمثل المكاتب، والثاني يمثل النوافذ.</p>
 <div class="grid">
 <div>
 <h3>📋 الدليل من الجدول</h3>
 ${roomTable(false)}
 <div class="note">
 نكتب الزوج المرتب هكذا:
 (عدد المكاتب، عدد النوافذ).
 </div>
 <div class="choicebox" style="grid-template-columns:repeat(2,1fr)">
 <button id="pick3" onclick="selectPlotRoom(3)">
 الغرفة ٣
 </button>
 <button id="pick5" onclick="selectPlotRoom(5)">
 الغرفة ٥
 </button>
 </div>
 <h3>اختر موقع النقطة:</h3>
 <div class="choicebox">
 <button onclick="addPoint(26,4)">٢٦ مكتبًا، ٤ نوافذ</button>
 <button onclick="addPoint(27,7)">٢٧ مكتبًا، ٧ نوافذ</button>
 <button onclick="addPoint(26,7)">٢٦ مكتبًا، ٧ نوافذ</button>
 <button onclick="addPoint(27,4)">٢٧ مكتبًا، ٤ نوافذ</button>
 </div>
 </div>
 <div>
 <h3>📈 الرسم البياني</h3>
 <div id="plotArea">${plot()}</div>
 <p id="pointProgress" class="muted">
 النقطتان المفقودتان تنتظران الاكتشاف.
 </p>
 </div>
 </div>
 <div id="feedback" class="feedback" role="status"></div>
 <div class="actions">
 <button onclick="previous()">↩ الخطوة السابقة</button>
 <button id="nextButton" class="success hidden"
 disabled onclick="next()">
 اكتمل الرسم! الانتقال إلى الخطوة التالية ←
 </button>
 </div>
 </section>`;
}
function selectPlotRoom(id){
 if(addedPoints.includes(id)){
  feedback("لقد أضفت هذه الغرفة بالفعل. أكمل الأخرى.","info");
  return;
 }
 selectedRoom=id;
 $("pick3").classList.toggle("selected",id===3);
 $("pick5").classList.toggle("selected",id===5);
 feedback("الآن اختر عدد المكاتب والنوافذ الصحيح للغرفة "+ar(id)+".","info");
}
function addPoint(x,y){
 if(selectedRoom===null){
  feedback("اختر الغرفة ٣ أو ٥ أولًا.","info");
  return;
 }
 const r=rooms.find(t=>t.id===selectedRoom);
 if(r.desks!==x||r.windows!==y){
  feedback("النقطة ليست صحيحة. اقرأ عدد المكاتب أولًا ثم عدد النوافذ.","bad");
  return;
 }
 if(!addedPoints.includes(r.id))addedPoints.push(r.id);
 $("plotArea").innerHTML=plot();
 $("pick"+r.id).classList.add("correct");
 $("pick"+r.id).disabled=true;
 feedback("✅ نقطة الغرفة "+ar(r.id)+" في مكانها الصحيح!","good");
 selectedRoom=null;
 if(addedPoints.length===1){
  const other=addedPoints.includes(3)?5:3;
  $("pointProgress").textContent=
   "تبقّت الغرفة "+ar(other)+". اضغط زرها ثم اختر موقع نقطتها.";
  selectPlotRoom(other);
 }else{
  $("pointProgress").textContent=
   "اكتملت النقطتان بنجاح! يمكنك المتابعة الآن.";
  markSolved();
  feedback("أحسنت أيها المحقق! أضفت الغرفتين ٣ و٥. اضغط الزر الأخضر للمتابعة.");
 }
}

/* الخطوة السادسة: تحليل البيانات */
function scene6(){
 game.innerHTML=`
 <section class="panel">
 <h2>🔍 (ج) ماذا اكتشف محسن بعد إكمال الرسم؟</h2>
 <div class="grid">
 <div><h3>التمثيل المكتمل</h3>${plot(true)}</div>
 <div>
 <h3>اختر الاستنتاج الصحيح:</h3>
 <div style="display:grid;gap:10px">
 <button onclick="answerWindows(0,this)">
 عدد النوافذ يزداد دائمًا عندما يزداد عدد المكاتب.
 </button>
 <button onclick="answerWindows(1,this)">
 الغرفة التي تحتوي على أكبر عدد من المكاتب
 تحتوي أيضًا على أكبر عدد من النوافذ،
 لكن زيادة المكاتب لا تعني دائمًا زيادة النوافذ.
 </button>
 <button onclick="answerWindows(2,this)">
 جميع الغرف فيها عدد النوافذ نفسه.
 </button>
 </div>
 </div>
 </div>
 ${actionArea("احصل على وسام المحقق الذكي 🏅")}
 </section>`;
}
function answerWindows(n,btn){
 if(solved)return;
 if(n===1){
  btn.classList.add("correct");
  markSolved();
  feedback("رائع! الغرفة ٤ تضم ٢٨ مكتبًا و١٠ نوافذ، وهي الأعلى في كليهما. لكن بقية الغرف لا تتبع دائمًا علاقة طردية ثابتة.");
 }else feedback("راجع النقاط: هل كل زيادة في عدد المكاتب تعني زيادة عدد النوافذ؟","bad");
}

/* الخطوة السابعة: الوسام */
function scene7(){
 game.innerHTML=`
 <section class="panel">
 <div class="reward">
 <div class="medal">🏅</div>
 <h2>وسام المحقق الذكي</h2>
 <h3>أحسنت أيها المحقق البطل!</h3>
 <p>لقد نجحت في كشف البيانات المفقودة
 وإكمال التمثيلات البيانية.</p>
 <h2 id="winnerName">محقق الرياضيات المتميز</h2>
 <p>⭐ قضية القمصان: مكتملة</p>
 <p>⭐ قضية النوافذ والمكاتب: مكتملة</p>
 <p>🎉 أنت الآن محقق بيانات محترف!</p>
 </div>
 <div id="nameForm" class="panel" style="margin-top:20px">
 <h3>اكتب اسمك على الوسام:</h3>
 <input id="studentName" placeholder="اسم الطالب"
 maxlength="55" oninput="setWinner(this.value)">
 <div class="actions">
 <button class="primary" onclick="window.print()">🖨️ طباعة الوسام</button>
 <button onclick="restart()">🔄 العب من جديد</button>
 <button onclick="toggleSound()" id="soundButton">
 🔊 الصوت
 </button>
 </div></div>
 </section>`;
 beep(true);
}
function setWinner(name){
 $("winnerName").textContent=name.trim()||"محقق الرياضيات المتميز";
}
function restart(){
 step=0;solved=false;totalCorrect=0;
 pickedRooms=[];addedPoints=[];selectedRoom=null;
 render();window.scrollTo({top:0,behavior:"smooth"});
}
function toggleSound(){
 soundEnabled=!soundEnabled;
 $("soundButton").textContent=soundEnabled?"🔊 الصوت":"🔇 الصوت مغلق";
}

/* بدء التطبيق */
render();
</script>
</body>
</html>
