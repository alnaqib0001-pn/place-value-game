
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>المحقق الذكي | ما البيانات المفقودة؟</title>
<style>
:root{
 --navy:#193756;--blue:#2069b6;
 --green:#148255;--gold:#ffc545;
 --bg:#f3f8ff;--line:#d9e5f2;
 --text:#253f5b;--red:#cf3544;
}
*{box-sizing:border-box}
body{
 margin:0;background:var(--bg);color:var(--text);
 font:18px/1.85 Tahoma,Arial,sans-serif;
}
button,select,input{font:inherit}
button{cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,select:focus-visible{
 outline:3px solid #ffc545;outline-offset:3px
}
.shell{max-width:1150px;margin:auto;padding:18px}
.hero{
 background:linear-gradient(125deg,#15314f,#2479b9);
 color:white;border-radius:24px;padding:25px;
 display:flex;justify-content:space-between;
 align-items:center;gap:15px;
}
.hero h1{font-size:clamp(28px,5vw,42px);margin:0}
.hero p{margin:3px 0;color:#dcefff}
.hero .emoji{font-size:65px}
.pill{
 background:#ffffff24;border-radius:25px;
 display:inline-block;padding:2px 14px;
 font-size:14px;margin-bottom:10px
}
.top{
 display:flex;align-items:center;
 gap:12px;margin:20px 0;flex-wrap:wrap
}
.progress{flex:1;display:flex;gap:6px;min-width:160px}
.progress span{
 flex:1;height:12px;background:#d6e5f2;
 border-radius:15px
}
.progress span.on{background:#fbbf24}
.panel{
 background:white;border:1px solid var(--line);
 border-radius:24px;padding:25px;margin-top:15px;
 box-shadow:0 6px 20px #1645750d
}
.panel h2{
 font-size:clamp(24px,4vw,31px);
 color:var(--navy);margin:5px 0 10px
}
.panel h3{color:#21496f;margin:10px 0}
.desc{color:#617891}
.tag{
 display:inline-block;background:#e7f2ff;
 color:#195789;border-radius:13px;
 padding:5px 15px;font-weight:bold
}
.grid{
 display:grid;grid-template-columns:1fr 1fr;
 gap:18px;align-items:start
}
.box{
 background:#f7fbff;border:1px solid #e0eafa;
 padding:18px;border-radius:20px
}
.scroll{overflow-x:auto}
table{
 width:100%;border-collapse:collapse;
 text-align:center;min-width:390px;font-size:16px
}
th,td{border:1px solid #d2dfec;padding:8px}
th{background:#e2effd}
td:first-child{font-weight:bold}
tr:nth-child(even) td{background:#eef6ff}
.options{
 display:flex;flex-wrap:wrap;
 gap:10px;margin:15px 0
}
.opt{
 background:white;border:2px solid #c8dced;
 color:#244563;border-radius:15px;
 padding:12px 18px;font-weight:bold;
 min-width:110px
}
.opt:hover,.opt.sel{
 border-color:#2580ce;background:#e5f3ff
}
.opt.good{background:#ddf8e8;border-color:#168657}
.btn{
 border:0;border-radius:14px;
 padding:13px 22px;font-weight:bold
}
.blue{background:var(--blue);color:white}
.green{background:var(--green);color:white}
.white{
 background:white;color:#235f9a;
 border:2px solid #b8d4ed
}
.actions{
 display:flex;gap:12px;flex-wrap:wrap;
 margin-top:18px;align-items:center
}
.next{
 display:block;width:100%;margin-top:16px;
 background:#148255;color:white;
 border:0;border-radius:15px;
 padding:17px;font-weight:bold;font-size:21px
}
.next.hidden{display:none}
.feedback{
 display:none;margin-top:15px;
 padding:15px;border-radius:15px;font-weight:bold
}
.feedback.ok{
 display:block;background:#e0f8e9;
 color:#13643f;border:1px solid #9bdab9
}
.feedback.no{
 display:block;background:#fff0ef;
 color:#a32937;border:1px solid #efb7b7
}
.feedback.tip{
 display:block;background:#fff6df;
 color:#825715;border:1px solid #efd899
}
.note{
 background:#fff7df;border-right:5px solid #efb52c;
 border-radius:12px;padding:13px;margin:12px 0
}
.chart{width:100%;height:auto;display:block}
.build{
 display:grid;grid-template-columns:100px 1fr 95px;
 gap:10px;padding:10px 2px;
 border-bottom:1px solid #dce8f4;align-items:center
}
.build select{
 width:100%;max-width:220px;
 background:white;border:2px solid #b7cfe5;
 border-radius:11px;padding:10px;
 color:var(--navy);font-weight:bold
}
.build.done select{
 background:#e4f8ed;border-color:#168255
}
.small{font-size:14px;color:#657b92}
.dot{
 display:inline-block;width:13px;height:13px;
 border-radius:50%;border:1px solid #999;
 vertical-align:middle;margin-left:5px
}
.plotbox{position:relative;width:100%}
.plotbox svg{display:block;width:100%;height:auto}
.plot-target{
 cursor:pointer;outline:none
}
.plot-target:focus{
 stroke:#f59e0b;stroke-width:5
}
.plot-target:hover{stroke-width:5}
.pointcta{
 width:100%;background:#175d99;
 color:white;border:0;border-radius:15px;
 padding:17px;font-weight:bold;font-size:20px;
 margin:12px 0
}
.status{
 background:#eaf5ff;border:2px solid #91c6f6;
 padding:15px;border-radius:15px;
 margin-top:16px;font-weight:bold;color:#174e7b
}
.award{
 border:4px solid #e9b632;
 background:linear-gradient(#fff9df,#edfaff);
 border-radius:25px;padding:35px 20px;
 text-align:center
}
.award .medal{font-size:95px}
.name{
 width:320px;max-width:100%;
 border:2px solid #adcbe7;border-radius:13px;
 padding:13px;text-align:center
}
footer{
 text-align:center;color:#6c8095;
 font-size:13px;padding:20px
}
@media(max-width:760px){
 .grid{grid-template-columns:1fr}
 .panel{padding:15px}
 .hero{padding:16px}
 .hero .emoji{font-size:40px}
 .build{grid-template-columns:72px 1fr 70px}
 body{font-size:16px}
 .opt{min-width:85px}
}
@media print{
 header,.top,.actions,.next,footer,
 button,#nameEntry{display:none!important}
 body{background:white}
 .panel{box-shadow:none;border:0}
 .award{min-height:80vh}
}
</style>
</head>
<body>

<div class="shell">
<header class="hero">
 <div>
  <span class="pill">رياضيات الصف الرابع • النشاط الثالث</span>
  <h1>🕵️ المحقق الذكي</h1>
  <p>ما البيانات المفقودة؟</p>
  <p>ابحث عن الأدلة، واكتشف المفقود، وأكمل التمثيل!</p>
 </div>
 <div class="emoji">🔎</div>
</header>

<div class="top">
 <div class="progress" id="progress"></div>
 <strong id="counter"></strong>
 <button class="btn white" onclick="toggleSound()" id="soundBtn">
 🔊 الصوت
 </button>
</div>

<main id="screen" aria-live="polite"></main>
<footer>نشاط تفاعلي مستند إلى كتاب الرياضيات ودليل المعلم</footer>
</div>

<script>
"use strict";

/* تحويل جميع الأرقام الظاهرة إلى العربية المشرقية */
const digits="٠١٢٣٤٥٦٧٨٩";
const ar=n=>String(n).replace(/[0-9]/g,d=>digits[+d]);
const $=id=>document.getElementById(id);

/* بيانات القمصان */
const students=[
 "فريد","كريم","جابر","هشام","سالم","سلمان"
];
const colors=[
 {name:"أحمر",hex:"#ef4e59"},
 {name:"أزرق",hex:"#2e9fda"},
 {name:"أخضر",hex:"#52af56"},
 {name:"أصفر",hex:"#ffca33"},
 {name:"أبيض",hex:"#ffffff"}
];
const shirts=[
 [1,0,1,0,2],
 [1,1,1,1,2],
 [0,4,0,0,3],
 [1,0,0,1,5],
 [2,1,1,1,1],
 [1,0,2,2,2]
];
const before=[5,6,4,5,13];
const complete=[6,6,5,5,15];

/* بيانات الفصول والمكاتب والنوافذ */
const rooms=[
 {id:1,d:24,w:5},
 {id:2,d:24,w:7},
 {id:3,d:26,w:4},
 {id:4,d:28,w:10},
 {id:5,d:27,w:7},
 {id:6,d:26,w:6},
 {id:7,d:24,w:4},
 {id:8,d:27,w:8},
 {id:9,d:26,w:5},
 {id:10,d:27,w:6}
];

let stage=0;
let solved=false;
let selectedRooms=new Set();
let barAnswers=[null,null,null,null,null];
let points=new Set();
let activeRoom=3;
let sound=true;

/* مؤثر صوتي قصير */
function beep(ok){
 if(!sound)return;
 try{
  const C=window.AudioContext||window.webkitAudioContext;
  if(!C)return;
  const ctx=new C();
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  osc.type="sine";
  osc.frequency.setValueAtTime(ok?650:240,ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(
   ok?850:170,ctx.currentTime+.16
  );
  gain.gain.setValueAtTime(.05,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(
   .001,ctx.currentTime+.22
  );
  osc.connect(gain);gain.connect(ctx.destination);
  osc.start();osc.stop(ctx.currentTime+.23);
  osc.onended=()=>ctx.close();
 }catch(e){}
}
function toggleSound(){
 sound=!sound;
 $("soundBtn").textContent=sound?"🔊 الصوت":"🔇 صامت";
}
function message(text,type="ok"){
 const f=$("feedback");
 if(!f)return;
 f.className="feedback "+type;
 f.textContent=text;
 if(type!=="tip")beep(type==="ok");
}
function unlock(text){
 solved=true;
 const b=$("next");
 if(b){
  b.disabled=false;
  b.classList.remove("hidden");
 }
 if(text)message(text,"ok");
}
function go(n){
 if(n>stage&&!solved)return;
 stage=n;
 solved=false;
 render();
 window.scrollTo({top:0,behavior:"smooth"});
}
function back(){
 if(stage>0){
  stage--;
  solved=false;
  render();
 }
}
function base(title,description,tag,body){
 return `<section class="panel">
  <span class="tag">${tag}</span>
  <h2>${title}</h2>
  <p class="desc">${description}</p>
  ${body}
  <div id="feedback" class="feedback" role="status"></div>
 </section>`;
}
function navigation(label){
 return `<div class="actions">
 <button class="btn white" onclick="back()"
 ${stage===0?"disabled":""}>↩ الخطوة السابقة</button>
 <button class="btn white" onclick="showHint()">💡 تلميح</button>
 </div>
 <button id="next" class="next hidden" disabled
 onclick="go(${stage+1})">${label} ⬅️</button>`;
}
const hints=[
 "قارن مجموع الأحمر والأزرق، ثم افحص قمصان فريد.",
 "أضف قمصان فريد إلى كل عمود من الرسم القديم.",
 "انظر إلى العمودين الأحمر والأزرق، ثم الأخضر والأصفر.",
 "ابحث عن نقطتين موجودتين في الجدول وغير موجودتين في الرسم.",
 "الغرفة ٣: ٢٦ مكتبًا و٤ نوافذ. الغرفة ٥: ٢٧ مكتبًا و٧ نوافذ.",
 "قارن بين عدد المكاتب والنوافذ في الغرف المختلفة."
];
function showHint(){
 message("💡 تلميح المحقق: "+hints[stage],"tip");
}
function setProgress(){
 $("progress").innerHTML=
 Array.from({length:7},(_,i)=>
 `<span class="${i<=stage?"on":""}"></span>`).join("");
 $("counter").textContent=stage===6?
 "اكتملت القضيتان":"الخطوة "+ar(stage+1)+" من ٧";
}

/* جدول القمصان */
function shirtTable(){
 return `<div class="scroll"><table>
 <thead><tr><th>الطالب</th>
 ${colors.map(c=>`<th>
 <span class="dot" style="background:${c.hex}"></span>
 ${c.name}</th>`).join("")}
 </tr></thead><tbody>
 ${shirts.map((row,i)=>`<tr><td>${students[i]}</td>
 ${row.map(v=>`<td>${v===0?"صفر":ar(v)}</td>`).join("")}
 </tr>`).join("")}
 </tbody></table></div>`;
}

/* رسم الأعمدة */
function barChart(values,title){
 const W=560,H=315;
 const left=50,bottom=250,top=24,max=16;
 let svg=`<svg class="chart" viewBox="0 0 ${W} ${H}"
 role="img" aria-label="تمثيل بالأعمدة لعدد القمصان">`;
 for(let n=0;n<=16;n+=4){
  let y=bottom-n/max*210;
  svg+=`<line x1="48" y1="${y}" x2="540" y2="${y}"
  stroke="#dae5f1"/>
  <text x="37" y="${y+5}" text-anchor="middle"
  fill="#546a82" font-size="15">${ar(n)}</text>`;
 }
 values.forEach((n,i)=>{
  let h=n/max*210;
  let x=72+i*95;
  svg+=`<rect x="${x}" y="${bottom-h}"
  width="49" height="${h}" rx="5"
  fill="${colors[i].hex}" stroke="#59718b"
  stroke-width="1.5"/>
  <text x="${x+24}" y="${bottom-h-8}"
  text-anchor="middle" fill="#173858"
  font-weight="bold" font-size="18">${ar(n)}</text>
  <text x="${x+24}" y="279" text-anchor="middle"
  font-size="16">${colors[i].name}</text>`;
 });
 svg+=`<path d="M48 23 V250 H540"
 stroke="#435c75" fill="none" stroke-width="2"/>
 <text x="295" y="310" text-anchor="middle"
 font-size="14">ألوان القمصان</text></svg>`;
 return `<div class="box"><h3>${title}</h3>${svg}</div>`;
}

/* المرحلة الأولى */
function scene0(){
 const body=`
 <div class="grid">
 <div class="box">
 <h3>📋 جدول سالم الأصلي</h3>
 ${shirtTable()}
 </div>
 ${barChart(before,"📊 رسم سالم الناقص")}
 </div>
 <div class="note">
 يقول سالم إن الأبيض أكثر الألوان شيوعًا،
 وإن الأزرق أكثر من الأحمر، والأصفر أكثر من الأخضر.
 </div>
 <h3>(أ) من الطالب الذي لم تُدرج بياناته؟</h3>
 <div class="options">
 ${students.map(n=>`<button class="opt"
 onclick="answerStudent('${n}',this)">${n}</button>`).join("")}
 </div>
 ${navigation("الخطوة ٢: أكمل التمثيل")}`;
 return base("القضية الأولى: الطالب المفقود",
 "ستة طلاب شاركوا في مسح ألوان القمصان، لكن بيانات أحدهم غير موجودة في الرسم.",
 "القضية ١ • اكتشف المفقود",body);
}
function answerStudent(name,b){
 if(solved)return;
 if(name==="فريد"){
  b.classList.add("good");
  unlock("أحسنت أيها المحقق البطل! فريد هو المفقود. بإضافة بياناته يتساوى الأحمر مع الأزرق، والأخضر مع الأصفر.");
 }else{
  message("حاول مجددًا! اقرأ الجدول وقارن مجموع ألوان القمصان بالرسم.","no");
 }
}

/* المرحلة الثانية: القوائم المنسدلة */
function scene1(){
 const rows=colors.map((c,i)=>`
 <div class="build" id="build${i}">
 <strong><span class="dot"
 style="background:${c.hex}"></span>${c.name}</strong>
 <select id="color${i}" onchange="changeBar(${i},this.value)"
 aria-label="اختر العدد الكامل للقمصان ${c.name}">
 <option value="">اختر العدد</option>
 ${Array.from({length:17},(_,k)=>`
 <option value="${k}"
 ${barAnswers[i]===k?"selected":""}>${ar(k)}</option>
 `).join("")}
 </select>
 <span class="small">كان ${ar(before[i])}</span>
 </div>`).join("");
 const shown=barAnswers.map((n,i)=>n===null?before[i]:n);
 const body=`
 <div class="grid">
 ${barChart(before,"قبل إضافة بيانات فريد")}
 <div class="box">
 <h3>🎨 أكمل بيانات الألوان</h3>
 <p>اختر العدد الصحيح من القائمة المنسدلة لكل لون.</p>
 ${rows}
 <div class="note">
 القيمة الجديدة = العدد في الرسم القديم + قمصان فريد.
 </div>
 </div>
 </div>
 <div id="newChart" style="margin-top:18px">
 ${barChart(shown,"📊 التمثيل الذي تبنيه")}
 </div>
 <div class="actions">
 <button class="btn blue" onclick="checkBars()">
 🔎 تحقق من الأعمدة
 </button>
 </div>
 ${navigation("الخطوة ٣: قارن النتائج")}`;
 return base("(ب) أنشئ تمثيلًا بيانيًا مكتملًا",
 "أضف بيانات فريد إلى الأعمدة باستخدام القوائم المنسدلة، وشاهد الرسم يتغير أمامك.",
 "القضية ١ • أكمل التمثيل",body);
}
function changeBar(i,value){
 if(solved)return;
 barAnswers[i]=value===""?null:Number(value);
 const shown=barAnswers.map((n,j)=>
 n===null?before[j]:n);
 $("newChart").innerHTML=barChart(
 shown,"📊 التمثيل الذي تبنيه"
 );
 $("build"+i).classList.toggle(
 "done",barAnswers[i]===complete[i]
 );
}
function checkBars(){
 const wrong=colors.filter((c,i)=>
 barAnswers[i]!==complete[i]).map(c=>c.name);
 if(wrong.length){
  message("راجع الأعمدة التالية: "+
  wrong.join("، ")+". أضف بيانات فريد إلى القيم القديمة.","no");
 }else{
  unlock("ممتاز! أصبح مجموع القمصان: الأحمر ٦، الأزرق ٦، الأخضر ٥، الأصفر ٥، الأبيض ١٥.");
 }
}

/* المرحلة الثالثة: مقارنة نتائج سالم */
function scene2(){
 const body=`
 <div class="grid">
 ${barChart(before,"الرسم الناقص")}
 ${barChart(complete,"الرسم المكتمل")}
 </div>
 <h3>(ج) بِمَ تختلف النتائج الجديدة؟</h3>
 <div class="options" style="display:grid">
 <button class="opt" onclick="answerCompare(0,this)">
 الأزرق ما زال أكثر من الأحمر.
 </button>
 <button class="opt" onclick="answerCompare(1,this)">
 الأحمر يساوي الأزرق، والأخضر يساوي الأصفر.
 </button>
 <button class="opt" onclick="answerCompare(2,this)">
 لم تتغير أي نتيجة.
 </button>
 </div>
 ${navigation("ابدأ القضية الثانية")}`;
 return base("قارن واستنتج",
 "هل يمكن أن تغيّر البيانات المفقودة استنتاجنا؟ انظر إلى الرسمين.",
 "القضية ١ • الاستنتاج",body);
}
function answerCompare(n,b){
 if(solved)return;
 if(n===1){
  b.classList.add("good");
  unlock("صحيح! الأبيض بقي الأكثر شيوعًا، لكن الأحمر أصبح مساويًا للأزرق، والأخضر مساويًا للأصفر.");
 }else message("انظر إلى ارتفاع الأعمدة في الرسم المكتمل.","no");
}

/* جدول الغرف */
function roomTable(onlyMissing=false){
 const rows=onlyMissing?
 rooms.filter(r=>r.id===3||r.id===5):rooms;
 return `<div class="scroll"><table>
 <thead><tr><th>الغرفة</th>
 <th>المكاتب</th><th>النوافذ</th></tr></thead>
 <tbody>${rows.map(r=>`
 <tr><td>${ar(r.id)}</td>
 <td>${ar(r.d)}</td><td>${ar(r.w)}</td></tr>
 `).join("")}</tbody></table></div>`;
}

/* رسم النقاط والدائرتين الزرقاوين */
function scatter(interactive=false,full=false){
 const L=75,B=285;
 const x=d=>L+(d-23)*88;
 const y=w=>B-(w-3)*31;
 let s=`<svg class="chart" viewBox="0 0 590 365"
 role="img" aria-label="تمثيل عدد المكاتب والنوافذ">`;
 for(let d=24;d<=28;d++){
  s+=`<line x1="${x(d)}" y1="36" x2="${x(d)}"
  y2="${B}" stroke="#dce7f3"/>
  <text x="${x(d)}" y="310" text-anchor="middle"
  font-size="16">${ar(d)}</text>`;
 }
 for(let w=4;w<=10;w++){
  s+=`<line x1="${L}" y1="${y(w)}"
  x2="535" y2="${y(w)}" stroke="#dce7f3"/>
  <text x="53" y="${y(w)+5}" text-anchor="middle"
  font-size="16">${ar(w)}</text>`;
 }
 s+=`<path d="M75 35 V285 H540"
 fill="none" stroke="#415b76" stroke-width="3"/>
 <text x="300" y="349" text-anchor="middle"
 font-size="17">عدد المكاتب</text>
 <text transform="translate(19 169) rotate(-90)"
 text-anchor="middle" font-size="17">عدد النوافذ</text>`;
 rooms.forEach(r=>{
  const missing=r.id===3||r.id===5;
  const added=points.has(r.id);
  const show=!missing||full||added;
  if(show){
   s+=`<circle cx="${x(r.d)}" cy="${y(r.w)}"
    r="9" fill="${missing?"#29b77d":"#ffbd31"}"
    stroke="${missing?"#117a55":"#ba8112"}"
    stroke-width="2">
    <title>الغرفة ${ar(r.id)}</title></circle>`;
  }
  if(interactive&&missing&&!added){
   s+=`<circle cx="${x(r.d)}" cy="${y(r.w)}"
    r="17" fill="#e3f4ff" fill-opacity=".75"
    stroke="#258ce2" stroke-width="3"
    stroke-dasharray="5 4"
    class="plot-target" tabindex="0" role="button"
    aria-label="إضافة نقطة الغرفة ${ar(r.id)}"
    onclick="placePoint(${r.id})"
    onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();placePoint(${r.id})}">
    <title>اضغط لإضافة الغرفة ${ar(r.id)}</title>
    </circle>`;
  }
 });
 s+="</svg>";
 return `<div class="box"><div class="plotbox">${s}</div>
 <p class="small">المحور الأفقي: المكاتب • المحور الرأسي: النوافذ</p></div>`;
}

/* المرحلة الرابعة: تحديد الغرف */
function scene3(){
 selectedRooms=new Set();
 const body=`
 <div class="grid">
 <div class="box">
 <h3>📋 نتائج مسح محسن</h3>${roomTable()}
 </div>
 <div>
 <h3>📈 التمثيل الناقص</h3>${scatter()}
 </div>
 </div>
 <h3>(أ) أي الغرفتين غير مدرجتين في الرسم؟</h3>
 <p>اختر غرفتين ثم اضغط «تحقق».</p>
 <div class="options">
 ${rooms.map(r=>`<button class="opt"
 id="room${r.id}" onclick="chooseRoom(${r.id})">
 الغرفة ${ar(r.id)}</button>`).join("")}
 </div>
 <div class="actions">
 <button class="btn blue" onclick="checkRooms()">
 🔎 تحقق من الغرفتين
 </button>
 </div>
 ${navigation("الخطوة التالية: أضف النقطتين")}`;
 return base("القضية الثانية: الغرف المفقودة",
 "أجرى محسن مسحًا لعدد النوافذ والمكاتب في عشر غرف صفية، لكنه لم يمثل غرفتين.",
 "القضية ٢ • اكتشف الغرفتين",body);
}
function chooseRoom(id){
 if(solved)return;
 if(selectedRooms.has(id))selectedRooms.delete(id);
 else if(selectedRooms.size<2)selectedRooms.add(id);
 rooms.forEach(r=>{
  $("room"+r.id).classList.toggle(
  "sel",selectedRooms.has(r.id));
 });
}
function checkRooms(){
 if(selectedRooms.size!==2){
  message("اختر غرفتين أولًا.","tip");return;
 }
 if(selectedRooms.has(3)&&selectedRooms.has(5)){
  unlock("ممتاز! الغرفتان المفقودتان هما ٣ و٥. الغرفة ٣ بها ٢٦ مكتبًا و٤ نوافذ، والغرفة ٥ بها ٢٧ مكتبًا و٧ نوافذ.");
 }else{
  message("راجع النقاط الموجودة في الرسم وقارنها ببيانات الجدول.","no");
 }
}

/* المرحلة الخامسة: وضع نقطتي الغرفتين */
function scene4(){
 const done3=points.has(3),done5=points.has(5);
 if(done3&&!done5)activeRoom=5;
 if(done5&&!done3)activeRoom=3;
 const body=`
 <div class="grid">
 <div class="box">
 <h3>📋 الدليل من الجدول</h3>
 ${roomTable(true)}
 <p>اختر الغرفة ثم اضغط على الدائرة الزرقاء المتقطعة
 في موقعها الصحيح على الرسم.</p>
 <div class="options">
 <button id="choose3" class="opt ${activeRoom===3?"sel":""}"
 onclick="selectRoom(3)" ${done3?"disabled":""}>
 ${done3?"✅ ":""}الغرفة ٣
 </button>
 <button id="choose5" class="opt ${activeRoom===5?"sel":""}"
 onclick="selectRoom(5)" ${done5?"disabled":""}>
 ${done5?"✅ ":""}الغرفة ٥
 </button>
 </div>
 <div id="guide" class="status">
 ${points.size===2?
 "🎉 اكتمل الرسم! اضغط الزر الأخضر للمتابعة.":
 "👆 الغرفة المختارة: "+ar(activeRoom)+
 ". اضغط على دائرتها الزرقاء، أو استخدم الزر الكبير أدناه."}
 </div>
 <button id="addPointButton" class="pointcta"
 onclick="placePoint(activeRoom)"
 ${points.size===2?"disabled":""}>
 📍 ${points.size===2?
 "اكتملت النقطتان":
 "أضف نقطة الغرفة "+ar(activeRoom)+" إلى الرسم"}
 </button>
 </div>
 <div>
 <h3>🖊️ أضف النقطتين المفقودتين</h3>
 <div id="interactivePlot">
 ${scatter(true)}
 </div>
 <p class="small">
 الدائرتان الزرقاوان المتقطعتان هما النقطتان المفقودتان.
 بعد إضافتهما تتحولان إلى اللون الأخضر.
 </p>
 </div>
 </div>
 <button id="next" class="next"
 onclick="go(5)" ${points.size===2?"":"disabled"}>
 ${points.size===2?
 "✅ اكتمل الرسم! انتقل إلى الاستنتاج ⬅️":
 "🔒 أضف النقطتين أولًا للانتقال"}
 </button>
 <div class="actions">
 <button class="btn white" onclick="back()">↩ الخطوة السابقة</button>
 <button class="btn white" onclick="showHint()">💡 تلميح</button>
 </div>`;
 return base("(ب) أكمل تمثيل محسن",
 "اقرأ الزوج المرتب لكل غرفة وضع نقطتها المفقودة.",
 "القضية ٢ • استكمال التمثيل",body);
}
function selectRoom(id){
 if(points.has(id))return;
 activeRoom=id;
 $("choose3").classList.toggle("sel",id===3);
 $("choose5").classList.toggle("sel",id===5);
 $("guide").textContent=
 "الغرفة المختارة: "+ar(id)+
 ". ابحث عن النقطة الصحيحة في الرسم.";
 $("addPointButton").textContent=
 "📍 أضف نقطة الغرفة "+ar(id)+" إلى الرسم";
}
function placePoint(id){
 if(points.has(id))return;
 if(id!==activeRoom){
  message("أنت تبحث الآن عن الغرفة "+ar(activeRoom)+
  ". اختر دائرتها أولًا.","no");
  return;
 }
 points.add(id);
 beep(true);
 if(points.size===2){
  solved=true;
  $("interactivePlot").innerHTML=scatter(true);
  $("guide").textContent=
   "🎉 اكتمل الرسم! أضفت الغرفتين ٣ و٥ بنجاح.";
  $("addPointButton").disabled=true;
  $("addPointButton").textContent="✅ النقطتان مكتملتان";
  const next=$("next");
  next.disabled=false;
  next.textContent="✅ اكتمل الرسم! انتقل إلى الاستنتاج ⬅️";
  message("أحسنت أيها المحقق البطل! اضغط الزر الأخضر للانتقال.","ok");
 }else{
  const other=id===3?5:3;
  activeRoom=other;
  $("interactivePlot").innerHTML=scatter(true);
  $("choose"+id).disabled=true;
  $("choose"+id).textContent="✅ الغرفة "+ar(id);
  selectRoom(other);
  $("guide").textContent=
  "✅ أضفت الغرفة "+ar(id)+
  ". الآن أكمل الغرفة "+ar(other)+".";
  message("رائع! نقطة الغرفة "+ar(id)+
  " صحيحة. بقيت غرفة واحدة.","ok");
 }
}

/* المرحلة السادسة: استنتاج محسن */
function scene5(){
 const body=`
 <div class="grid">
 <div><h3>قبل الإكمال</h3>${scatter()}</div>
 <div><h3>بعد الإكمال</h3>${scatter(false,true)}</div>
 </div>
 <h3>(ج) بِمَ تختلف النتائج بعد إكمال الرسم؟</h3>
 <div class="options" style="display:grid">
 <button class="opt" onclick="finalAnswer(0,this)">
 كلما زاد عدد المكاتب زاد عدد النوافذ دائمًا.
 </button>
 <button class="opt" onclick="finalAnswer(1,this)">
 تكتمل بيانات جميع الغرف، ونلاحظ أن زيادة المكاتب
 لا تعني دائمًا زيادة النوافذ.
 </button>
 <button class="opt" onclick="finalAnswer(2,this)">
 عدد النوافذ متساوٍ في جميع الغرف.
 </button>
 </div>
 ${navigation("احصل على وسام المحقق الذكي 🏅")}`;
 return base("الاستنتاج الأخير",
 "قارن تمثيل محسن قبل الإكمال وبعده، واستنتج ما تغير.",
 "القضية ٢ • تحليل الأدلة",body);
}
function finalAnswer(n,b){
 if(solved)return;
 if(n===1){
  b.classList.add("good");
  unlock("صحيح! أصبحت بيانات جميع الغرف ممثلة، ولا توجد علاقة ثابتة تجعل النوافذ تزيد كلما زادت المكاتب.");
 }else{
  message("راجع الغرف التي تتساوى في المكاتب وتختلف في النوافذ.","no");
 }
}

/* المرحلة السابعة: الوسام */
function scene6(){
 return `<section class="panel">
 <div class="award">
 <div class="medal">🏅</div>
 <h2>وسام المحقق الذكي</h2>
 <h3>أحسنت أيها المحقق البطل!</h3>
 <p>نجحت في حل قضيتين باستخدام التفكير والاستدلال
 وقراءة البيانات والتمثيلات البيانية.</p>
 <h2 id="winner">محقق الرياضيات المتميز</h2>
 <div class="box" style="max-width:650px;margin:20px auto;text-align:right">

 <p>✅ أكملت تمثيل القمصان بالأعمدة.</p>
 <p>✅ القضية الثانية: اكتشفت الغرفتين ٣ و٥.</p>
 <p>✅ أضفت النقطتين وأكملت تمثيل محسن.</p>

 </div>

 <div id="nameEntry" style="text-align:center;margin-top:20px">

 <div class="actions" style="justify-content:center">

}

function restart(){
 stage=0;solved=false;
 selectedRooms=new Set();
 barAnswers=[null,null,null,null,null];
 points=new Set();activeRoom=3;
 render();
 window.scrollTo({top:0,behavior:"smooth"});
}
function render(){
 setProgress();
 const scenes=[
 scene0,scene1,scene2,scene3,
 scene4,scene5,scene6
 ];
 $("screen").innerHTML=scenes[stage]();
 if(stage===4&&points.size===2){
  solved=true;
 }
}
render();
</script>
