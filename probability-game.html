];
const defaults=()=>({stage:0,maxStage:0,name:'',sound:true,warmIndex:0,warmPos:50,warmDone:{},warmHints:{},bookIndex:0,bookPos:50,bookChoices:{},bookReasons:{},bookHints:{},own:[{text:'',rating:50,reason:''},{text:'',rating:50,reason:''}],ownDone:{},schoolIndex:0,schoolPos:50,schoolChoices:{},schoolReasons:{},schoolHints:{},challengeIndex:0,challengePos:50,challengeDone:{},teacherOpen:false,teacherVotes:[],teacherPrompt:'ما احتمال هطول المطر غدًا؟',teacherPaste:'',teacherMode:'click'});
let state;try{state={...defaults(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){state=defaults()}
state.teacherOpen=false;
const $=(s)=>document.querySelector(s);
const escapeHTML=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[Number(d)]);
const arLabel=n=>n===0?'مستحيل':n===100?'مؤكد':n===50?'متساوي الاحتمال':n<50?'غير مرجح حدوثه':'مرجح حدوثه';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({...state,teacherOpen:false}))}catch(e){}};
const score=()=>Object.values(state.warmDone).reduce((t,v)=>t+(v.points||0),0)+Object.keys(state.bookChoices).length*5+Object.keys(state.ownDone).length*5+Object.keys(state.schoolChoices).length*5+Object.values(state.challengeDone).reduce((t,v)=>t+(v.points||0),0);
const completed=()=>Object.keys(state.warmDone).length+Object.keys(state.bookChoices).length+Object.keys(state.ownDone).length+Object.keys(state.schoolChoices).length+Object.keys(state.challengeDone).length;
let audio=null;function ding(win=true){if(!state.sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.type='sine';o.frequency.value=win?660:300;g.gain.setValueAtTime(.065,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.15);o.start();o.stop(audio.currentTime+.16)}catch(e){}}
let toastTimer=null;function toast(s){const el=$('#toast');el.textContent=s;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2500)}
const btn=(label,act,secondary=false,disabled=false)=>`<button type="button" class="btn${secondary?' alt':''}" data-act="${act}" ${disabled?'disabled':''}>${label}</button>`;
const navline=(prev,next,nextText='التالي',disable=false)=>`<div class="footer-controls">${btn('↪ السابق',prev,true)}<span class="small">فكّر ← قدّر ← برّر</span>${btn(nextText+' ←',next,false,disable)}</div>`;
const progress=(num,total)=>`<div class="mission-progress" aria-hidden="true">${Array.from({length:total},(_,i)=>`<span class="${i<num?'done':i===num?'now':''}"></span>`).join('')}</div>`;
const slider=(id,n)=>`<div class="range-shell"><div class="range-title"><strong>حدّد درجة الاحتمال</strong><output class="big-number" id="${id}-value">${ar(n)} <span style="font-size:15px;color:#63798a">من ١٠٠</span></output></div><div class="scale-colors" aria-hidden="true"></div><div class="scale-marks" aria-hidden="true"><span>٠</span><span>٢٥</span><span>٥٠</span><span>٧٥</span><span>١٠٠</span></div><input class="prob-range" dir="rtl" type="range" min="0" max="100" step="5" value="${n}" data-slider="${id}" aria-label="مقياس الاحتمال من صفر عند اليمين إلى مئة عند اليسار"><div class="scale-labels"><span>مستحيل</span><span>متساوي الاحتمال</span><span>مؤكد</span></div><div style="text-align:center;margin-top:13px"><span class="focus-legend" id="${id}-label">${arLabel(n)}</span></div></div>`;

function home(){return `<div class="panel"><section class="hero"><span class="eyebrow">🎮 لعبة رياضيات تفاعلية</span><h1>مغامرة الاحتمال الذكي</h1><p>هل أنت مستعد لتصبح خبيرًا في توقع الأحداث؟ اكتشف مقياس الاحتمال، وقدّر أحداث كتابك، وحلّ تحديات ذكية!</p><div class="field" style="max-width:325px"><label for="nameInput">اسم المحقق (اختياري)</label><input id="nameInput" maxlength="32" value="${escapeHTML(state.name)}" placeholder="اكتب اسمك هنا" autocomplete="off"></div><div class="buttons-row">${btn('🚀 ابدأ المغامرة','start')}${btn('👨‍🏫 افتح لوحة المعلم','openTeacher',true)}</div><span class="hero-emoji" aria-hidden="true">🐱</span></section><div class="tiles"><div class="tile"><div class="ic">📏</div><h3>تعرّف على المقياس</h3><p>تعلم ما تعنيه الدرجات من ٠ إلى ١٠٠.</p></div><div class="tile"><div class="ic">🃏</div><h3>بطاقات من الكتاب</h3><p>قدّر أربعة أحداث، واختر دليلًا يبرر تقديرك.</p></div><div class="tile"><div class="ic">🏫</div><h3>مواقف الصف الرابع</h3><p>قدّر المواقف الخمسة كما وردت في النشاط الخامس.</p></div></div><div class="note">لطلاب الصف الرابع في برنامج موهبة: بعض الأحداث ليس لها رقم صحيح وحيد؛ نقاط هذه المهام تُمنح للمشاركة وتبرير التقدير، لا للموافقة على رأي المعلم.</div></div>`}
function scalePage(){const i=state.warmIndex,q=warm[i],r=state.warmDone[i],val=r?r.guess:state.warmPos;return `<div class="panel"><div class="section-top"><div><span class="step-label">المهمة الأولى · ${ar(i+1)} من ${ar(warm.length)}</span><h2>🔍 فك شفرة المقياس</h2><p>اسحب المؤشر أو اختر أحد الأعداد. هنا لدينا نتائج واضحة يمكن التحقق من درجتها.</p></div><span class="status">⭐ ${ar(score())} نقطة</span></div>${progress(i,warm.length)}<div class="question-card"><div class="reading"><div class="prompt-symbol">${q.icon}</div><div><h3>${q.q}</h3><p>اختر القيمة المناسبة على المقياس.</p></div></div>${slider('warm',val)}${choices('warm',val)}${r?`<div class="note ${r.correct?'success-note':'error-note'}"><strong>${r.correct?'🎉 أحسنت، إجابة صحيحة!':'💡 محاولة جيدة، لنتعلم من الدليل.'}</strong><div>${q.why}</div><div>درجتك: <strong>${ar(r.points)} نقاط</strong></div></div>`:(state.warmHints[i]?`<div class="hint">💡 تلميح: ${q.hint}</div>`:'')}</div><div class="buttons-row">${btn('💡 تلميح','warmHint',true,!!r)}${btn('تحقق من إجابتي ✓','warmCheck',false,!!r)}</div>${navline('warmPrev','warmNext',i===warm.length-1?'بطاقات الكتاب':'السؤال التالي',!r)}</div>`}
function bookRanking(){if(Object.keys(state.bookChoices).length!==book.length)return '';const ranked=book.map((e,i)=>({e,n:state.bookChoices[i].rating})).sort((a,b)=>a.n-b.n);return `<div class="summary"><strong>🏁 ترتيب بطاقاتك من الأقل احتمالًا إلى الأكثر</strong><div class="done-list">${ranked.map(({e,n})=>`<div class="done-item"><strong>${e.icon} ${e.title}</strong><span>تقديرك: ${ar(n)} من ١٠٠</span></div>`).join('')}</div><p class="small">هذا الترتيب ناتج عن تقديراتك أنت، ويمكن لزملائك اقتراح ترتيب آخر مع تبريرهم.</p></div>`}
function bookPage(){const i=state.bookIndex,e=book[i],saved=state.bookChoices[i],val=saved?saved.rating:state.bookPos,reason=state.bookReasons[i]||saved?.reason||'';return `<div class="panel"><div class="section-top"><div><span class="step-label">المهمة الثانية · ${ar(i+1)} من ${ar(book.length)}</span><h2>🃏 بطاقات المستقبل</h2><p>هذه الأحداث الأربعة من كتاب الطالب. لا توجد درجة واحدة صحيحة بالضرورة؛ الأهم هو تفسير اختيارك.</p></div><span class="status">⭐ ${ar(score())} نقطة</span></div>${progress(i,book.length)}<div class="question-card"><div class="reading"><div class="prompt-symbol">${e.icon}</div><div><h3>${e.title}</h3><p>ما مدى احتمال حدوث هذا الأمر في السنة القادمة؟</p></div></div>${slider('book',val)}<div class="field"><label for="bookReason">ما الدليل الذي تستند إليه؟</label><select id="bookReason"><option value="">اختر تبريرًا مناسبًا...</option>${e.reasons.map(x=>`<option value="${escapeHTML(x)}" ${x===reason?'selected':''}>${x}</option>`).join('')}</select></div>${state.bookHints[i]?`<div class="hint">💡 ${e.hint}</div>`:''}${saved?`<div class="note success-note">✅ سُجل تقديرك: <strong>${ar(saved.rating)} من ١٠٠</strong>، لأنك قدمت تبريرًا. يمكنك تغيير تقديرك وإعادة حفظه.</div>`:''}</div><div class="buttons-row">${btn('💡 فكرة تساعدني','bookHint',true)}${btn(saved?'تحديث تقديري ✓':'ثبّت تقديري ✓','bookSave')}</div>${i===book.length-1?bookRanking():''}${navline('bookPrev','bookNext',i===book.length-1?'ابتكر حدثين':'البطاقة التالية',!saved)}</div>`}
function ownPage(){return `<div class="panel"><div class="section-top"><div><span class="step-label">المهمة الثالثة</span><h2>💭 اصنع بطاقتيك</h2><p>كما في قصاصات الورق بكتاب الطالب: تخيل حدثين يمكن أن يقعا خلال السنة القادمة، وقدّر احتمال حدوث كل منهما.</p></div><span class="status">⭐ ${ar(score())} نقطة</span></div><div class="grid-two" style="margin-top:20px">${state.own.map((e,i)=>`<div class="question-card" style="margin-top:0"><h3>📝 البطاقة ${ar(i+1)}</h3><div class="field"><label for="ownTxt${i}">الحدث المقترح</label><textarea maxlength="180" id="ownTxt${i}" data-owntext="${i}" placeholder="مثال: سأقرأ كتابًا جديدًا هذا الشهر">${escapeHTML(e.text)}</textarea></div>${slider('own'+i,e.rating)}<div class="field"><label for="ownReason${i}">سبب تقديري</label><select id="ownReason${i}" data-ownreason="${i}"><option value="">اختر دليلًا...</option>${['أعتمد على تجربة سابقة.','أعتمد على معلومة أعرفها.','أحتاج إلى معلومات إضافية.','هذا مجرد توقع شخصي.'].map(s=>`<option value="${s}" ${s===e.reason?'selected':''}>${s}</option>`).join('')}</select></div><div class="buttons-row">${btn(state.ownDone[i]?'✓ محفوظة · عدّلها':'احفظ البطاقة','saveOwn'+i)}${state.ownDone[i]?'<span class="badge-success">✅ مكتملة</span>':''}</div></div>`).join('')}</div><div class="note">في تيمز: يستطيع المعلم أن يطلب من طالبين اقتراح حدثين شفهيًا ثم يكتب الحدثين هنا أمام الجميع؛ لا حاجة لتقسيم الفصل.</div>${navline('ownPrev','ownNext','مواقف الصف الرابع',Object.keys(state.ownDone).length!==2)}</div>`}
function schoolPage(){const i=state.schoolIndex,e=school[i],saved=state.schoolChoices[i],val=saved?saved.rating:state.schoolPos,reason=state.schoolReasons[i]||saved?.reason||'';return `<div class="panel"><div class="section-top"><div><span class="step-label">المهمة الرابعة · ${ar(i+1)} من ${ar(school.length)}</span><h2>🏫 تقديرات الصف الرابع</h2><p>تخيّل اختيار ثلاثة طلاب عشوائيًا من الصف الرابع في مدرستك. ما مدى احتمال الحدث الآتي؟</p></div><span class="status">⭐ ${ar(score())} نقطة</span></div>${progress(i,school.length)}<div class="question-card"><div class="reading"><div class="prompt-symbol">${e.icon}</div><div><h3>${e.title}</h3><p>أعطِ الحدث درجة من ٠ إلى ١٠٠، ثم علّل.</p></div></div>${slider('school',val)}<div class="field"><label for="schoolReason">بمَ تبرر تقديرك؟</label><select id="schoolReason"><option value="">اختر دليلًا...</option><option ${reason===e.reason?'selected':''}>${e.reason}</option><option ${reason==='لا أمتلك معلومات كافية لأقدّر بدقة.'?'selected':''}>لا أمتلك معلومات كافية لأقدّر بدقة.</option><option ${reason==='أقارن الحدث بمواقف مشابهة أعرفها.'?'selected':''}>أقارن الحدث بمواقف مشابهة أعرفها.</option></select></div>${state.schoolHints[i]?`<div class="hint">💡 ${e.hint}</div>`:''}${saved?`<div class="note success-note">✅ حفظنا تقديرك: <strong>${ar(saved.rating)} من ١٠٠</strong>. يمكن لأحد زملائك تقديم تقدير مختلف مع تبرير مقنع.</div>`:''}</div><div class="buttons-row">${btn('💡 تلميح','schoolHint',true)}${btn(saved?'تحديث التقدير':'تثبيت تقديري ✓','schoolSave')}</div>${navline('schoolPrev','schoolNext',i===school.length-1?'التحدي الأخير':'الموقف التالي',!saved)}</div>`}
function challengePage(){const i=state.challengeIndex,q=challenge[i],r=state.challengeDone[i],val=r?r.guess:state.challengePos;return `<div class="panel"><div class="section-top"><div><span class="step-label">المهمة الخامسة · ${ar(i+1)} من ${ar(challenge.length)}</span><h2>🏆 التحدّي الأخير</h2><p>في هذه الأسئلة يمكن التحقق من الإجابة؛ اختر الدرجة المطابقة تمامًا للحدث.</p></div><span class="status">⭐ ${ar(score())} نقطة</span></div>${progress(i,challenge.length)}<div class="question-card"><div class="reading"><div class="prompt-symbol">${q.icon}</div><div><h3>${q.q}</h3></div></div>${slider('challenge',val)}${choices('challenge',val)}${r?`<div class="note ${r.correct?'success-note':'error-note'}"><strong>${r.correct?'✅ إجابة دقيقة!':'📖 تعلّم من التفسير التالي:'}</strong><div>${q.why}</div><div>الدرجة الصحيحة: <b>${ar(q.ans)} من ١٠٠</b></div></div>`:''}</div><div class="buttons-row">${btn('تحقق من الإجابة ✓','challengeCheck',false,!!r)}</div>${navline('challengePrev','challengeNext',i===challenge.length-1?'احصل على الوسام':'السؤال التالي',!r)}</div>`}
function finishPage(){const s=score(),sname=(state.name||'المحقق الذكي').trim(),title=s>=125?'خبير الاحتمالات':s>=85?'محقق الاحتمالات':s>=45?'مستكشف الاحتمالات':'متدرّب الاحتمالات';return `<div class="panel"><div class="section-top"><div><span class="step-label">أكملت المغامرة</span><h2>🎖️ وسام المحقق</h2><p>الاحتمال ليس توقعًا عشوائيًا؛ بل تقدير مبني على معلومات وأسباب.</p></div></div><div class="certificate"><div class="medal">🏅</div><div class="stars">★ ★ ★</div><h2>شهادة إنجاز</h2><p>تُمنح إلى</p><h3>${escapeHTML(sname)}</h3><p>لمشاركته في نشاط «ما احتمال حدوث شيء ما؟»</p><h3>${title}</h3><div class="score-big">⭐ ${ar(s)} <span style="font-size:16px">من ١٥٥ نقطة</span></div><p class="small">الدرجات في بطاقات الكتاب ومواقف الصف تُمنح لتقدير معلَّل، ولا توجد إجابة رقمية واحدة مفروضة.</p><hr class="divider"><p>برنامج موهبة · الصف الرابع الابتدائي · النشاط الخامس</p><p><strong>أ. صهيب بن عبدالعزيز النقيب</strong></p></div><div class="aside-stats"><div class="stat"><strong>${ar(Object.keys(state.warmDone).length)} / ٥</strong><span>أسئلة المقياس</span></div><div class="stat"><strong>${ar(Object.keys(state.bookChoices).length)} / ٤</strong><span>بطاقات الكتاب</span></div><div class="stat"><strong>${ar(Object.keys(state.schoolChoices).length)} / ٥</strong><span>مواقف الصف</span></div><div class="stat"><strong>${ar(completed())} / ٢١</strong><span>مهمات أُنجزت</span></div></div><div class="buttons-row" style="justify-content:center">${btn('🖨️ اطبع الوسام','print',true)}${btn('🔄 ابدأ من جديد','reset')}${btn('📊 لوحة المعلم','openTeacher',true)}</div></div>`}
function route(){return `<div>${STAGES.map(([label,ic],i)=>`<button type="button" ${i>state.maxStage?'disabled':''} data-stage="${i}" class="${state.stage===i?'active':i<state.stage?'past':''}">${ic} ${label}</button>`).join('')}</div>`}
function render(){save();$('#route').innerHTML=STAGES.map(([name,ic],i)=>`<button type="button" class="${state.stage===i?'active':i<state.stage?'past':''}" ${i>state.maxStage?'disabled':''} data-stage="${i}">${ic} ${name}</button>`).join('');$('#score-pill').textContent=`⭐ ${ar(score())} نقطة`;$('#soundBtn').textContent=state.sound?'🔊 الصوت':'🔇 الصوت';$('#game').innerHTML=[home,scalePage,bookPage,ownPage,schoolPage,challengePage,finishPage][state.stage]();if(state.teacherOpen)renderTeacher();else $('#teacherRoot').innerHTML=''}
function go(n){if(n>state.maxStage)state.maxStage=n;state.stage=n;render();window.scrollTo({top:0,behavior:'smooth'})}
function bump(kind,i,dir,size,defaultVal){let key=kind+'Index';state[key]=Math.min(size-1,Math.max(0,state[key]+dir));if(state[key]!==i)state[defaultVal]=50;render()}
function setValue(group,val){val=Math.max(0,Math.min(100,Number(val)));if(group==='warm'){if(state.warmDone[state.warmIndex])return;state.warmPos=val}else if(group==='book'){state.bookPos=val;if(state.bookChoices[state.bookIndex])delete state.bookChoices[state.bookIndex]}else if(group==='school'){state.schoolPos=val;if(state.schoolChoices[state.schoolIndex])delete state.schoolChoices[state.schoolIndex]}else if(group==='challenge'){if(state.challengeDone[state.challengeIndex])return;state.challengePos=val}else if(/^own[01]$/.test(group)){state.own[Number(group.slice(-1))].rating=val;delete state.ownDone[Number(group.slice(-1))]}const rng=document.querySelector(`[data-slider="${group}"]`);if(rng)rng.value=val;const value=$('#'+group+'-value'),label=$('#'+group+'-label');if(value)value.innerHTML=`${ar(val)} <span style="font-size:15px;color:#63798a">من ١٠٠</span>`;if(label)label.textContent=arLabel(val);document.querySelectorAll(`[data-choice="${group}"]`).forEach(e=>e.classList.toggle('sel',Number(e.dataset.value)===val));save()}
function act(name){switch(name){
case'start':go(1);break;
case'openTeacher':state.teacherOpen=true;render();break;
case'closeTeacher':state.teacherOpen=false;render();break;
case'warmHint':state.warmHints[state.warmIndex]=true;render();break;
case'warmCheck':{let i=state.warmIndex;if(state.warmDone[i])break;const correct=state.warmPos===warm[i].ans;state.warmDone[i]={guess:state.warmPos,correct,points:correct?(state.warmHints[i]?7:10):0};ding(correct);render();break}
case'warmPrev':if(state.warmIndex>0)bump('warm',state.warmIndex,-1,warm.length,'warmPos');else go(0);break;
case'warmNext':if(!state.warmDone[state.warmIndex]){toast('تحقق من الإجابة أولًا');break}if(state.warmIndex===warm.length-1)go(2);else bump('warm',state.warmIndex,1,warm.length,'warmPos');break;
case'bookHint':state.bookHints[state.bookIndex]=true;render();break;
case'bookSave':{let i=state.bookIndex;const reason=$('#bookReason')?.value||state.bookReasons[i]||'';if(!reason){toast('اختر دليلًا يبرر تقديرك أولًا');break}state.bookReasons[i]=reason;state.bookPos=Number(document.querySelector('[data-slider="book"]')?.value??state.bookPos);state.bookChoices[i]={rating:state.bookPos,reason};ding();render();break}
case'bookPrev':if(state.bookIndex>0)bump('book',state.bookIndex,-1,book.length,'bookPos');else go(1);break;
case'bookNext':if(!state.bookChoices[state.bookIndex]){toast('ثبّت تقديرك أولًا');break}if(state.bookIndex===book.length-1)go(3);else bump('book',state.bookIndex,1,book.length,'bookPos');break;
case'ownPrev':go(2);break;
case'ownNext':if(Object.keys(state.ownDone).length!==2){toast('احفظ البطاقتين أولًا');break}go(4);break;
case'schoolHint':state.schoolHints[state.schoolIndex]=true;render();break;
case'schoolSave':{const i=state.schoolIndex,reason=$('#schoolReason')?.value||state.schoolReasons[i]||'';if(!reason){toast('اختر سببًا لتقديرك');break}state.schoolReasons[i]=reason;state.schoolPos=Number(document.querySelector('[data-slider="school"]')?.value??state.schoolPos);state.schoolChoices[i]={rating:state.schoolPos,reason};ding();render();break}
case'schoolPrev':if(state.schoolIndex>0)bump('school',state.schoolIndex,-1,school.length,'schoolPos');else go(3);break;
case'schoolNext':if(!state.schoolChoices[state.schoolIndex]){toast('ثبّت التقدير أولًا');break}if(state.schoolIndex===school.length-1)go(5);else bump('school',state.schoolIndex,1,school.length,'schoolPos');break;
case'challengeCheck':{let i=state.challengeIndex;if(state.challengeDone[i])break;let correct=state.challengePos===challenge[i].ans;state.challengeDone[i]={guess:state.challengePos,correct,points:correct?10:0};ding(correct);render();break}
case'challengePrev':if(state.challengeIndex>0)bump('challenge',state.challengeIndex,-1,challenge.length,'challengePos');else go(4);break;
case'challengeNext':if(!state.challengeDone[state.challengeIndex]){toast('تحقق من إجابتك أولًا');break}if(state.challengeIndex===challenge.length-1)go(6);else bump('challenge',state.challengeIndex,1,challenge.length,'challengePos');break;
case'print':window.print();break;
case'reset':if(window.confirm('هل تريد بدء لعبة جديدة ومسح التقدم المحفوظ على هذا الجهاز؟')){const sound=state.sound;state=defaults();state.sound=sound;go(0)}break;
case'undoVote':state.teacherVotes.pop();renderTeacher();save();break;
case'clearVotes':if(window.confirm('مسح أصوات الجولة الحالية؟')){state.teacherVotes=[];renderTeacher();save()}break;
case'importVotes':{const raw=$('#pasteVotes').value||'';const pieces=raw.replace(/[٠-٩۰-۹]/g,c=>'٠١٢٣٤٥٦٧٨٩'.includes(c)?String('٠١٢٣٤٥٦٧٨٩'.indexOf(c)):String('۰۱۲۳۴۵۶۷۸۹'.indexOf(c))).split(/[,،؛;\s|\/]+/).filter(Boolean);const nums=pieces.map(Number);if(!nums.length||nums.some(v=>!Number.isInteger(v)||v<0||v>100)){toast('أدخل أرقامًا من ٠ إلى ١٠٠ مفصولة بفواصل');break}if(nums.length>17){toast('الحد الأقصى ١٧ تقديرًا في الجولة');break}state.teacherVotes=nums;renderTeacher();save();toast('تم تسجيل التقديرات');break}
case'teacherFullscreen':{const el=$('#teacherPanel');if(el?.requestFullscreen)el.requestFullscreen().catch(()=>toast('وضع ملء الشاشة غير متاح'));break}
}}
function saveOwn(i){let e=state.own[i];if(e.text.trim().length<5){toast('اكتب حدثًا واضحًا من خمس حروف على الأقل');return}if(!e.reason){toast('اختر سببًا لتقديرك');return}state.ownDone[i]=true;ding();render()}
function chartVotes(){const votes=state.teacherVotes,counts=[0,0,0,0,0];votes.forEach(n=>counts[Math.min(4,Math.floor(n/20.001))]++);const max=Math.max(1,...counts),labels=['٠–٢٠','٢١–٤٠','٤١–٦٠','٦١–٨٠','٨١–١٠٠'];return `<div class="bars">${counts.map((n,i)=>`<div class="barcol"><div class="bar-num">${ar(n)}</div><div class="bar" style="height:${Math.max(2,n/max*123)}px"></div></div>`).join('')}</div><div class="grid-two" style="grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:7px">${labels.map(l=>`<div class="bar-label">${l}</div>`).join('')}</div>`}
function renderTeacher(){if(!state.teacherOpen)return;let avg=state.teacherVotes.length?state.teacherVotes.reduce((a,b)=>a+b,0)/state.teacherVotes.length:null;$('#teacherRoot').innerHTML=`<div class="modalwrap" id="teacherOverlay"><div class="modal" id="teacherPanel" role="dialog" aria-modal="true" aria-label="لوحة المعلم"><div class="modalhead"><div><h2>📊 لوحة التصويت المباشر</h2><div class="small">لإدارة الفصل المكوّن من ١٧ طالبًا عبر مشاركة الشاشة في تيمز.</div></div><button type="button" class="btn tiny alt" data-act="closeTeacher">✕ إغلاق</button></div><div class="field"><label for="teacherPrompt">السؤال الحالي</label><input id="teacherPrompt" maxlength="160" value="${escapeHTML(state.teacherPrompt)}"></div><div class="vote-layout"><div><h3 style="margin:6px 0">أضف تقديرًا واحدًا في كل نقرة</h3><div class="small">تُستخدم الأزرار للتقديرات الشائعة، ويمكن إدخال أي درجة عبر مربع النص أدناه.</div><div class="vote-btns">${[0,25,50,75,100].map(n=>`<button type="button" data-vote="${n}" ${state.teacherVotes.length>=17?'disabled':''}>${ar(n)}</button>`).join('')}</div><div class="teacher-sample">إذا أجاب طالب بدرجة أخرى مثل ٣٥، أضفها مع بقية الإجابات من مربع الإدخال.</div><div class="field"><label for="pasteVotes">أو الصق درجات الطلاب مفصولة بفواصل</label><textarea id="pasteVotes" rows="2" placeholder="٢٥، ٥٠، ٧٠، ٢٠، ٩٥">${escapeHTML(state.teacherPaste)}</textarea></div><div class="buttons-row">${btn('📥 عرض هذه الدرجات','importVotes',true)}${btn('↶ تراجع','undoVote',true,state.teacherVotes.length===0)}${btn('مسح الجولة','clearVotes',true,state.teacherVotes.length===0)}</div></div><div><div class="vote-count">وصلنا إلى ${ar(state.teacherVotes.length)} من ١٧ تقديرًا</div>${chartVotes()}<div class="summary" style="text-align:center"><div class="small">متوسط تقديرات الفصل</div><div class="big-number">${avg===null?'—':ar(Math.round(avg))} <span style="font-size:14px">من ١٠٠</span></div></div></div></div><hr class="divider"><div class="teacher-footer">⚠️ تُسجَّل الأصوات يدويًا على جهاز المعلم فقط؛ اللعبة لا تتصل بحسابات الطلاب ولا تستورد الردود من تيمز تلقائيًا. عند إلصاق الدرجات، تُستبدل أصوات الجولة الحالية.</div><div class="buttons-row">${btn('⛶ تكبير اللوحة','teacherFullscreen',true)}${btn('✓ العودة إلى اللعبة','closeTeacher')}</div></div></div>`}
// Central input, change and click handlers.
document.addEventListener('input',e=>{const el=e.target;if(el.id==='nameInput'){state.name=el.value;save()}else if(el.dataset.slider){setValue(el.dataset.slider,el.value)}else if(el.dataset.owntext!==undefined){let i=Number(el.dataset.owntext);state.own[i].text=el.value;delete state.ownDone[i];save()}else if(el.id==='teacherPrompt'){state.teacherPrompt=el.value;save()}else if(el.id==='pasteVotes'){state.teacherPaste=el.value;save()}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='bookReason'){state.bookReasons[state.bookIndex]=el.value;delete state.bookChoices[state.bookIndex];save()}else if(el.id==='schoolReason'){state.schoolReasons[state.schoolIndex]=el.value;delete state.schoolChoices[state.schoolIndex];save()}else if(el.dataset.ownreason!==undefined){let i=Number(el.dataset.ownreason);state.own[i].reason=el.value;delete state.ownDone[i];save()}});
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el||el.disabled)return;if(el.id==='soundBtn'){state.sound=!state.sound;render();return}if(el.id==='teacherBtn'){act('openTeacher');return}if(el.dataset.act){if(el.dataset.act.startsWith('saveOwn'))saveOwn(Number(el.dataset.act.slice(-1)));else act(el.dataset.act);return}if(el.dataset.stage!==undefined){let n=Number(el.dataset.stage);if(n<=state.maxStage)go(n);return}if(el.dataset.choice){setValue(el.dataset.choice,Number(el.dataset.value));return}if(el.dataset.vote!==undefined){if(state.teacherVotes.length>=17){toast('اكتمل العدد ١٧');return}state.teacherVotes.push(Number(el.dataset.vote));ding();renderTeacher();save();return}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.teacherOpen){state.teacherOpen=false;render()}});
render();
})();
</script>
</body>
</html>
